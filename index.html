<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR SCRIPTS - Key System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(18, 18, 28, 0.95); border: 1px solid rgba(0, 255, 200, 0.3); border-radius: 16px; width: 100%; max-width: 420px; padding: 25px; box-shadow: 0 0 25px rgba(0, 255, 200, 0.15); text-align: center; }
        .header h2 { color: #00ffc8; font-size: 22px; margin-bottom: 6px; letter-spacing: 1px; }
        .header p { color: #8a8a9e; font-size: 13px; margin-bottom: 20px; }

        .step-container { display: flex; flex-direction: column; gap: 10px; }
        .step-btn { background: #1a1a2a; border: 1px solid #2e2e45; color: #fff; padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; text-decoration: none; }
        .step-btn.disabled { opacity: 0.4; pointer-events: none; }
        .step-btn.active:hover { border-color: #00ffc8; background: #222238; }
        .step-btn.done { border-color: #28a745; background: rgba(40, 167, 69, 0.15); color: #28a745; pointer-events: none; }

        #keyResultSection { display: none; margin-top: 15px; background: #141420; border: 1px dashed #00ffc8; padding: 15px; border-radius: 10px; }
        .key-box { background: #090910; border: 1px solid #2a2a3d; padding: 10px; border-radius: 6px; color: #00ffc8; font-family: monospace; font-size: 14px; font-weight: bold; letter-spacing: 1px; margin: 10px 0; word-break: break-all; }
        .btn-copy { background: #00ffc8; color: #000; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-copy:hover { background: #00cc9f; }
        .warning-msg { color: #ff3b30; font-size: 11px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>⚡ JR SCRIPTS KEY ⚡</h2>
            <p>Selesaikan 4 Misi (Wajib min. 5 detik per tab)</p>
        </div>

        <div class="step-container" id="stepsContainer">
            <a href="https://www.rblxscripts.net/scripts/script-aimbot-and-tringgerbot-best-work-e607f633" target="_blank" class="step-btn active" id="btnStep1" onclick="startStep(1, 5)">
                <span>1️⃣ Like rblx.net</span><span id="status1">➔</span>
            </a>
            <a href="https://www.rblxscripts.net/scripts/script-aimbot-and-tringgerbot-best-work-e607f633" target="_blank" class="step-btn disabled" id="btnStep2" onclick="startStep(2, 5)">
                <span>2️⃣ Favorit rblx.net</span><span id="status2">🔒</span>
            </a>
            <a href="https://www.rblxscripts.net/scripts/script-aimbot-and-tringgerbot-best-work-e607f633" target="_blank" class="step-btn disabled" id="btnStep3" onclick="startStep(3, 5)">
                <span>3️⃣ Copy Link rblx.net</span><span id="status3">🔒</span>
            </a>
            <a href="https://www.roblox.com/users/9169232907/profile" target="_blank" class="step-btn disabled" id="btnStep4" onclick="startStep(4, 5)">
                <span>4️⃣ Favorit Akun: UNIKLOO5</span><span id="status4">🔒</span>
            </a>
            <div class="warning-msg" id="warningMsg">❌ GAGAL! Jangan kembali sebelum 5 detik! Misi direset.</div>
        </div>

        <div id="keyResultSection">
            <p style="font-size: 12px; color: #aaa;">🔑 Key Sah Sesuai Algoritma:</p>
            <div class="key-box" id="keyDisplay">JRK-LOADING...</div>
            <button class="btn-copy" onclick="copyKey()">📋 SALIN KEY</button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let stepStartTime = 0;
        let activeTimer = null;
        let isWaiting = false;

        function startStep(stepNum, minSec) {
            if (stepNum !== currentStep) return;
            stepStartTime = new Date().getTime();
            isWaiting = true;
            document.getElementById("warningMsg").style.display = "none";
            let st = document.getElementById("status" + stepNum);
            st.innerText = "⏳ 5s...";

            activeTimer = setInterval(() => {
                let elapsed = Math.floor((new Date().getTime() - stepStartTime) / 1000);
                if (elapsed >= minSec) {
                    clearInterval(activeTimer);
                    isWaiting = false;
                    passStep(stepNum);
                } else {
                    st.innerText = "⏳ " + (minSec - elapsed) + "s...";
                }
            }, 1000);
        }

        window.addEventListener("focus", function() {
            if (isWaiting) {
                clearInterval(activeTimer);
                isWaiting = false;
                let st = document.getElementById("status" + currentStep);
                st.innerText = "❌ Gagal";
                document.getElementById("warningMsg").style.display = "block";
                setTimeout(() => {
                    st.innerText = "➔";
                    document.getElementById("warningMsg").style.display = "none";
                }, 2500);
            }
        });

        function passStep(stepNum) {
            document.getElementById("btnStep" + stepNum).classList.remove("active");
            document.getElementById("btnStep" + stepNum).classList.add("done");
            document.getElementById("status" + stepNum).innerText = "✅";

            if (stepNum < 4) {
                currentStep = stepNum + 1;
                let nextBtn = document.getElementById("btnStep" + currentStep);
                nextBtn.classList.remove("disabled");
                nextBtn.classList.add("active");
                document.getElementById("status" + currentStep).innerText = "➔";
            } else {
                generateAlgorithmicKey();
            }
        }

        function generateAlgorithmicKey() {
            // Mengikuti rumus matematika algoritma yang sama dengan Owner Panel & Script Roblox
            let num1 = Math.floor(Math.random() * 90) + 10;
            let num2 = (num1 * 3) + 7;
            let chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            let c1 = chars.charAt(Math.floor(Math.random() * chars.length));
            let c2 = chars.charAt(Math.floor(Math.random() * chars.length));

            let finalKey = "JRK-" + num1 + c1 + num2 + c2;

            document.getElementById("stepsContainer").style.display = "none";
            document.getElementById("keyResultSection").style.display = "block";
            document.getElementById("keyDisplay").innerText = finalKey;
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById("keyDisplay").innerText);
            let btn = document.querySelector(".btn-copy");
            btn.innerText = "✅ TERKOPI!";
            setTimeout(() => { btn.innerText = "📋 SALIN KEY"; }, 2000);
        }
    </script>
</body>
</html>
